<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin check – Naija Mart</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBFAF6;color:#1D2822;font:500 17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:520px;margin:0 auto;padding:20px 18px 50px}
h1{font-size:1.5rem;margin:0 0 4px}.mu{color:#68756E;font-size:.95rem}
.row{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #E5E9E2;border-radius:16px;padding:14px;margin:10px 0}
.d{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;margin-top:2px}
.ok{background:#1E7A4C}.no{background:#B3261E}.wt{background:#B7791F}
.row b{display:block}.row small{color:#68756E;display:block;overflow-wrap:anywhere}
input{width:100%;min-height:50px;border-radius:12px;border:1.5px solid #E5E9E2;padding:0 14px;margin:6px 0 10px;font:inherit}
button{min-height:50px;border-radius:12px;border:0;background:#0F3D2E;color:#fff;font:inherit;font-weight:700;padding:0 20px;cursor:pointer;width:100%}
button.o{background:none;border:1.5px solid #0F3D2E;color:#0F3D2E;margin-top:8px}
.box{background:#fff;border:1px solid #E5E9E2;border-radius:16px;padding:16px;margin:12px 0}
.sum{border-radius:16px;padding:16px;margin:14px 0;font-weight:700}
.sum.g{background:#D8EFE2;color:#145C38}.sum.r{background:#F8D9D6;color:#8A1C14}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
 <h1>Naija Mart admin check</h1>
 <p class="mu">This page tests everything your admin dashboard needs, and tells you in plain words what to fix.</p>

 <div class="box" id="login" hidden>
  <b>Step 1: Sign in with your admin email</b>
  <input id="e" type="email" placeholder="Email address" autocomplete="email">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button id="go">Sign in</button>
  <p class="mu" id="le" style="color:#B3261E"></p>
 </div>

 <div id="res" hidden>
  <div id="sum" class="sum" hidden></div>
  <div id="list"></div>
  <button class="o" id="out">Sign out</button>
 </div>
</div>
<script type="module">
const firebaseConfig={apiKey:"AIzaSyCRQapXUQ32P4tpKaMiS11uccUc-z5k9yg",authDomain:"naija-mart-35ba6.firebaseapp.com",projectId:"naija-mart-35ba6",appId:"1:761759831734:web:2780ba182d5947d0cff817"};
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,collection} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const add=(st,t,s)=>{$("list").insertAdjacentHTML("beforeend",'<div class="row"><span class="d '+st+'">'+(st==="ok"?"✓":st==="no"?"✕":"…")+'</span><div><b>'+t+'</b><small>'+s+'</small></div></div>')};
$("go").onclick=async()=>{
 $("le").textContent="";
 try{await signInWithEmailAndPassword(auth,$("e").value.trim(),$("p").value)}
 catch(e){$("le").textContent=e.code==="auth/invalid-credential"?"Wrong email or password. If you forgot it, use Forgot password on the sign-in page.":"Couldn’t sign in ("+(e.code||"error")+"). Check your internet."}
};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 $("login").hidden=!!u;$("res").hidden=!u;$("list").innerHTML="";$("sum").hidden=true;
 if(!u)return;
 let fail=[];
 add("ok","Signed in","Email: "+esc(u.email)+" · Account ID: "+esc(u.uid));
 // admin entry
 let isAdmin=false;
 try{const a=await getDoc(doc(db,"admins",u.uid));
  if(a.exists()){isAdmin=true;add("ok","Your admin entry exists","The admins collection has your account ID. Role: "+esc(a.data().role))}
  else{add("no","No admin entry for this account","This account ID isn’t in the admins collection. If this isn’t ikechiking005@gmail.com, sign out and use that one. Otherwise add this exact ID as a document in admins.");fail.push("Wrong account or missing admin entry.")}
 }catch(e){add("no","Couldn’t read the admins collection","Firebase refused ("+esc(e.code||"error")+"). The new security rules are probably not published. Open Firestore, then Rules, paste the latest rules and tap Publish.");fail.push("Publish the latest Firestore rules.")}
 // sellerApplications
 try{const s=await getDocs(collection(db,"sellerApplications"));add("ok","Can read seller applications","Found "+s.size+" application(s).")}
 catch(e){add("no","Can’t read seller applications","Error: "+esc(e.code||"error")+". "+(isAdmin?"Publish the latest rules.":"Expected, because this account isn’t an admin."));fail.push("Seller applications blocked.")}
 // users
 try{const s=await getDocs(collection(db,"users"));add("ok","Can read user accounts","Found "+s.size+" account(s).")}
 catch(e){add("no","Can’t read user accounts","Error: "+esc(e.code||"error")+". The latest rules let admins read this.");fail.push("User accounts blocked.")}
 // live admin.html version
 try{const t=await (await fetch("admin.html?"+Date.now())).text();
  if(t.indexOf('id="so2"')>-1)add("ok","Latest admin.html is uploaded","Your site has the newest admin page.");
  else{add("no","Old admin.html is on your site","Upload the newest admin.html from our chat to GitHub (Add file, then Upload files).");fail.push("Upload the newest admin.html.")}
 }catch(e){add("no","admin.html not found on your site","Upload admin.html to GitHub, then reload this page.");fail.push("admin.html missing.")}
 const s=$("sum");s.hidden=false;
 if(!fail.length){s.className="sum g";s.innerHTML="Everything is ready. Open admin.html on your site and you will see your dashboard."}
 else{s.className="sum r";s.innerHTML="Fix this first: "+esc(fail[0])}
});
</script>
</body>
</html>
