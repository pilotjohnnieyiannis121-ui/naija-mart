const PATHS={home:"M4 11 12 4l8 7v9H4z",search:"M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4",heart:"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z",chat:"M4 5h16v11H9l-5 4z",user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6",bell:"M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4",pin:"M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z",shield:"M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6zM9 12l2 2 4-4",check:"m5 12 5 5 9-10",plus:"M12 5v14M5 12h14",back:"M15 5l-7 7 7 7",share:"M6 14a2.5 2.5 0 1 0 0-4 2.5 2.5 0 0 0 0 4zM18 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM18 21a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM8.2 10.9l7.6-4M8.2 13.1l7.6 4",flag:"M5 21V4h12l-2 4 2 4H5",store:"M4 9l1-5h14l1 5M4 9v11h16V9M4 9a3 3 0 0 0 5.3 1.9A3 3 0 0 0 14.7 10.9 3 3 0 0 0 20 9M9 20v-5h6v5",logout:"M9 4H5v16h4M16 8l4 4-4 4M20 12H9",gear:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2",help:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01",clock:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2",chev:"m9 5 7 7-7 7",box:"M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8",send:"M4 12 20 4l-4 16-4-6z",x:"M6 6l12 12M18 6 6 18"};
const I=n=>'<svg class="i" viewBox="0 0 24 24"><path d="'+PATHS[n]+'"/></svg>';
const S={u:null,name:"",saves:new Set(),follows:new Map(),shops:{}};
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)}
const need=()=>{toast("Sign in to continue");setTimeout(()=>location.href="auth.html",800)};
const recGet=()=>{try{return JSON.parse(localStorage.getItem("nm_rec2")||"[]")}catch(e){return[]}};
const recAdd=pid=>{try{localStorage.setItem("nm_rec2",JSON.stringify([pid].concat(recGet().filter(x=>x!==pid)).slice(0,12)))}catch(e){}};
function norm(d){const x=d.data();return {id:d.id,sellerId:x.sellerId,shopName:x.shopName||"Shop",name:x.name||"Product",price:x.price,cat:x.cat,state:x.state||"",city:x.city||"",area:x.area||"",cond:x.cond,stock:x.stock,qty:x.qty,brand:x.brand||"",desc:x.desc||"",options:x.options||"",delivery:x.delivery||"",thumb:x.thumb||"",status:x.status,createdAt:x.createdAt}}
async function loadShops(){const s=await getDocs(collection(db,"shops"));S.shops={};s.docs.forEach(d=>S.shops[d.id]=d.data())}
async function loadSocial(){
 const u=S.u;if(!u)return;
 const [a,b,c]=await Promise.allSettled([getDocs(query(collection(db,"saves"),where("userId","==",u.uid))),getDocs(query(collection(db,"follows"),where("buyerId","==",u.uid))),getDoc(doc(db,"users",u.uid))]);
 S.saves=new Set(a.status==="fulfilled"?a.value.docs.map(d=>d.data().pid):[]);
 S.follows=new Map(b.status==="fulfilled"?b.value.docs.map(d=>[d.data().sellerId,d.data().shopName]):[]);
 S.name=(c.status==="fulfilled"&&c.value.exists()?c.value.data().name:"")||u.displayName||"";
}
const cnt=(pid,n)=>updateDoc(doc(db,"products",pid),{saveCount:increment(n)}).catch(()=>{});
async function toggleSave(pid){
 if(!S.u){need();return false}
 const id=S.u.uid+"_"+pid;
 try{if(S.saves.has(pid)){await deleteDoc(doc(db,"saves",id));S.saves.delete(pid);cnt(pid,-1);toast("Removed from saved")}else{await setDoc(doc(db,"saves",id),{userId:S.u.uid,pid,createdAt:serverTimestamp()});S.saves.add(pid);cnt(pid,1);toast("Saved")}return true}
 catch(e){toast("Couldn’t update. Please try again.");return false}
}
async function toggleFollow(sid,name){
 if(!S.u){need();return false}
 if(sid===S.u.uid){toast("This is your own shop.");return false}
 const id=S.u.uid+"_"+sid;
 try{if(S.follows.has(sid)){await deleteDoc(doc(db,"follows",id));S.follows.delete(sid);toast("Unfollowed "+name)}else{await setDoc(doc(db,"follows",id),{buyerId:S.u.uid,sellerId:sid,shopName:String(name).slice(0,80),createdAt:serverTimestamp()});S.follows.set(sid,name);toast("Following "+name)}return true}
 catch(e){toast("Couldn’t update. Please try again.");return false}
}
function pcard(p){
 const ci=catOf(p),v=S.shops[p.sellerId]&&S.shops[p.sellerId].verified===true,sv=S.saves.has(p.id),img=safeImg(p.thumb),href="product.html?id="+encodeURIComponent(p.id);
 const st=p.stock==="out"?'<span class="no">Out of stock</span>':p.stock==="low"?'<span class="lo">Low stock</span>':'<span class="ok">In stock</span>';
 return '<article class="pc"><a class="im" href="'+href+'" style="background:'+TILE[ci%4]+'" aria-label="View '+esc(p.name)+'">'+(img?'<img src="'+img+'" alt="" loading="lazy">':art(ci))+'</a><button class="hv" data-sv="'+esc(p.id)+'" aria-pressed="'+sv+'" aria-label="Save '+esc(p.name)+'">'+I("heart")+'</button><div class="pb"><a href="'+href+'"><h3>'+esc(p.name)+'</h3></a><div class="pr">'+N(p.price)+'</div><div class="sh"><a href="shop.html?id='+encodeURIComponent(p.sellerId)+'">'+esc(p.shopName)+'</a>'+(v?' <span class="vf">'+I("shield")+'Verified</span>':'')+'</div><div class="mt">'+I("pin")+' '+esc(p.city)+', '+esc(p.state)+'</div><div class="mt">'+st+' · '+ago(p.createdAt)+'</div></div></article>';
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-sv],[data-fl]");if(!t)return;
 e.preventDefault();
 const ok=t.dataset.sv?await toggleSave(t.dataset.sv):await toggleFollow(t.dataset.fl,t.dataset.n||"");
 if(ok&&typeof onSocial==="function")onSocial();
});

const qs=new URLSearchParams(location.search),toId=qs.get("to"),toShop=(qs.get("shop")||"").slice(0,80),toPid=qs.get("pid");
let me="",list=[],cur=null,msgs=[],unM=null,filt="all",q="",isSeller=false,ctxP=null,lastMark=0;
const myF=c=>c.buyerId===S.u.uid?"buyerSeen":"sellerSeen",otF=c=>c.buyerId===S.u.uid?"sellerSeen":"buyerSeen";
const other=c=>c.buyerId===S.u.uid?c.shopName:c.buyerName;
const ini=s=>String(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const unread=c=>!!c.lastFrom&&c.lastFrom!==S.u.uid&&sec(c.lastAt)>sec(c[myF(c)]);
const dayLab=t=>{const s=sec(t);if(!s)return "Today";const d=new Date(s*1000),n=new Date(),k=x=>x.getFullYear()*400+x.getMonth()*31+x.getDate(),df=k(n)-k(d);return df===0?"Today":df===1?"Yesterday":d.toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"})};
const shortT=t=>{const s=sec(t);if(!s)return "";const d=new Date(s*1000),n=new Date();return d.toDateString()===n.toDateString()?hm(t):dayLab(t)};
function drawList(){
 $("load").hidden=true;$("ls").hidden=false;
 const un=list.filter(unread).length;
 $("fc").innerHTML='<button data-f="all" aria-pressed="'+(filt==="all")+'">All ('+list.length+')</button><button data-f="un" aria-pressed="'+(filt==="un")+'">Unread ('+un+')</button>';
 const k=q.toLowerCase();
 const L=list.filter(c=>(filt!=="un"||unread(c))&&(!k||(other(c)+" "+c.lastText).toLowerCase().indexOf(k)>-1));
 $("ls").innerHTML=L.length?L.map(c=>'<button class="li'+(unread(c)?" un":"")+'" data-o="'+esc(c.id)+'"><div class="av">'+esc(ini(other(c)))+'</div><div class="sp"><b>'+esc(other(c))+'</b><div class="pv">'+(c.lastFrom===S.u.uid?"You: ":"")+esc(c.lastText)+'</div></div><div style="text-align:right"><span class="t">'+shortT(c.lastAt)+'</span>'+(unread(c)?'<div class="bdg">New</div>':'')+'</div></button>').join(""):'<div class="card empty" style="margin-top:14px">'+I("chat")+'<h3>'+(list.length?"No conversations match":"No messages yet")+'</h3><p>'+(list.length?"Try another search or filter.":(isSeller?"When a buyer messages you about a product, it appears here.":"Open a product and tap “Message seller” to start a conversation."))+'</p>'+(isSeller?'':'<a class="btn p" href="marketplace.html">Browse products</a>')+'</div>';
}
function tick(m,c){return sec(c[otF(c)])>=sec(m.at)&&sec(m.at)>0?'<span class="tk r">✓✓</span>':'<span class="tk">✓</span>'}
function drawThread(){
 const e=$("ms");let h="",last="";
 msgs.forEach(m=>{
  const d=dayLab(m.at);if(d!==last){h+='<div class="dy"><span>'+d+'</span></div>';last=d}
  const mine=m.from===S.u.uid;let b="";
  if(m.pname)b+='<a class="pcd" href="product.html?id='+encodeURIComponent(m.pid||"")+'"><span class="pt" style="background:'+TILE[(Number.isInteger(m.pcat)?m.pcat:11)%4]+'">'+art(Number.isInteger(m.pcat)?m.pcat:11)+'</span><span><b>'+esc(m.pname)+'</b><br>'+N(m.pprice)+'<br><span class="g">View product ›</span></span></a>';
  if(safeImg(m.img))b+='<img class="mi" data-big="1" src="'+safeImg(m.img)+'" alt="Photo">';
  if(m.text)b+='<div>'+esc(m.text)+'</div>';
  h+='<div class="b'+(mine?" me":"")+'">'+b+'<small>'+hm(m.at)+(mine?tick(m,cur):"")+'</small></div>';
 });
 const atEnd=e.scrollHeight-e.scrollTop-e.clientHeight<140;
 e.innerHTML=h||'<p class="mu" style="text-align:center;margin-top:20px">Say hello. Ask about price, stock or pickup.</p>';
 if(atEnd||!e.dataset.s){e.scrollTop=e.scrollHeight;e.dataset.s="1"}
}
function drawCtx(){const x=$("cx");if(!ctxP||!cur||msgs.some(m=>m.pid===ctxP.id)){x.hidden=true;return}x.hidden=false;const ci=catOf(ctxP);x.innerHTML='<span class="pt" style="background:'+TILE[ci%4]+'">'+art(ci)+'</span><div class="sp"><div class="mu">Asking about</div><b>'+esc(ctxP.name)+'</b> · '+N(ctxP.price)+'</div><button class="btn s" data-nc="1" type="button">Remove</button>'}
function markSeen(){
 if(!cur||cur.isNew)return;
 const lo=[...msgs].reverse().find(m=>m.from!==S.u.uid);if(!lo)return;
 const t=sec(lo.at)||Math.floor(Date.now()/1000);if(t<=lastMark)return;lastMark=t;
 updateDoc(doc(db,"chats",cur.id),{[myF(cur)]:serverTimestamp()}).catch(()=>{});
}
async function openChat(c){
 cur=c;msgs=[];lastMark=0;$("lv").hidden=true;$("tv").hidden=false;$("ms").dataset.s="";
 $("ta").textContent=ini(other(c));$("tn").textContent=other(c);$("ts").textContent=c.buyerId===S.u.uid?"Seller":"Customer";
 $("tsh").hidden=c.buyerId!==S.u.uid;$("tsh").href="shop.html?id="+encodeURIComponent(c.sellerId);
 drawThread();drawCtx();
 if(unM){unM();unM=null}
 if(!c.isNew)subMsgs();
 if(c.buyerId===S.u.uid){try{const s=await getDoc(doc(db,"shops",c.sellerId));if(s.exists()&&cur&&cur.id===c.id){const x=s.data();$("ts").textContent=(x.verified===true?"Verified seller · ":"Seller · ")+x.city+", "+x.state}}catch(e){}}
}
function subMsgs(){
 if(unM)unM();
 unM=onSnapshot(query(collection(db,"chats",cur.id,"messages"),orderBy("at","asc")),s=>{msgs=s.docs.map(d=>d.data());drawThread();drawCtx();markSeen()},()=>toast("Couldn’t load messages. Reload the page."));
}
function showList(){if(unM){unM();unM=null}cur=null;ctxP=null;$("tv").hidden=true;$("lv").hidden=false;drawList()}
async function shrink(file){
 const u=URL.createObjectURL(file);
 try{
  const go=(max,qy)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",qy))};im.onerror=()=>rej();im.src=u});
  let d=await go(800,.7);if(d.length>200000)d=await go(640,.55);return d;
 }finally{URL.revokeObjectURL(u)}
}
async function send(img){
 const t=$("mi").value.trim();if((!t&&!img)||!cur)return;
 if(!navigator.onLine)return toast("No connection. Try again.");
 $("sd").disabled=true;
 try{
  const created=cur.isNew,txt=t.slice(0,1000),preview=txt||"📷 Photo";
  const msg={from:S.u.uid,text:txt,at:serverTimestamp()};
  if(img)msg.img=img;
  if(ctxP&&!msgs.some(m=>m.pid===ctxP.id)){msg.pid=ctxP.id;msg.pname=String(ctxP.name).slice(0,100);msg.pprice=Number(ctxP.price)||0;msg.pcat=catOf(ctxP)}
  if(created){await setDoc(doc(db,"chats",cur.id),{buyerId:cur.buyerId,sellerId:cur.sellerId,buyerName:String(cur.buyerName).slice(0,60),shopName:String(cur.shopName).slice(0,80),lastText:preview.slice(0,200),lastAt:serverTimestamp(),lastFrom:S.u.uid});cur.isNew=false;subMsgs()}
  const b=writeBatch(db);b.set(doc(collection(db,"chats",cur.id,"messages")),msg);
  if(!created)b.update(doc(db,"chats",cur.id),{lastText:preview.slice(0,200),lastAt:serverTimestamp(),lastFrom:S.u.uid});
  await b.commit();$("mi").value="";ctxP=null;drawCtx();
 }catch(x){toast(x.code==="permission-denied"?"Message not sent. The latest Firestore rules may not be published yet.":"Message not sent. Please try again.")}
 $("sd").disabled=false;
}
$("cf").onsubmit=e=>{e.preventDefault();send()};
$("pf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(!f.type.startsWith("image/")||f.size>15e6)return toast("Choose a photo under 15 MB.");try{send(await shrink(f))}catch(x){toast("Couldn’t read that photo. Try another.")}};
$("tb").onclick=showList;
$("q").oninput=e=>{q=e.target.value;drawList()};
$("ic").onclick=()=>$("iv").close();
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-f],[data-o],[data-nc],[data-big]");if(!t)return;
 if(t.dataset.f){filt=t.dataset.f;return drawList()}
 if(t.dataset.o){const c=list.find(x=>x.id===t.dataset.o);if(c)openChat(c);return}
 if(t.dataset.nc){ctxP=null;return drawCtx()}
 if(t.dataset.big){$("ib").src=t.src;$("iv").showModal()}
});
async function findCtx(){
 try{
  const ids=[toPid].concat(recGet()).filter(Boolean).slice(0,6);
  const docs=await Promise.all(ids.map(id=>getDoc(doc(db,"products",id)).catch(()=>null)));
  for(const d of docs){if(d&&d.exists()&&d.data().sellerId===toId&&d.data().status==="active"){ctxP=norm(d);return}}
 }catch(e){}
}
function startLists(){
 let A=[],B=[],n=0;
 const merge=()=>{const m={};[...A,...B].forEach(d=>m[d.id]=d);list=Object.values(m).sort((x,y)=>sec(y.lastAt)-sec(x.lastAt));if(cur&&!cur.isNew){const f=list.find(c=>c.id===cur.id);if(f)cur=f}if(!$("lv").hidden)drawList();else if(cur)drawThread()};
 return new Promise(res=>{
  let g1=false,g2=false;const done=()=>{if(g1&&g2)res()};
  onSnapshot(query(collection(db,"chats"),where("buyerId","==",S.u.uid)),s=>{A=s.docs.map(d=>({id:d.id,...d.data()}));merge();g1=true;done()},()=>{g1=true;done()});
  onSnapshot(query(collection(db,"chats"),where("sellerId","==",S.u.uid)),s=>{B=s.docs.map(d=>({id:d.id,...d.data()}));merge();g2=true;done()},()=>{g2=true;done()});
 });
}
onAuthStateChanged(auth,async u=>{
 if(!u)return location.replace("auth.html");
 S.u=u;
 try{
  try{const p=await getDoc(doc(db,"users",u.uid));me=p.exists()?p.data().name:""}catch(e){}
  me=me||u.displayName||"Buyer";
  try{const a=await getDoc(doc(db,"sellerApplications",u.uid));isSeller=a.exists()&&a.data().status==="approved"}catch(e){}
  $("bk").href=isSeller?"seller.html#home":"account.html";
  await Promise.race([startLists(),new Promise(r=>setTimeout(r,6000))]);
  if(toId&&toId!==u.uid){
   let name=toShop;try{const s=await getDoc(doc(db,"shops",toId));if(s.exists())name=s.data().shopName}catch(e){}
   await findCtx();
   const ex=list.find(c=>c.buyerId===u.uid&&c.sellerId===toId);
   openChat(ex||{id:u.uid+"_"+toId,buyerId:u.uid,sellerId:toId,buyerName:me,shopName:name||"Seller",isNew:true});
  }else showList();
 }catch(e){$("load").hidden=false;$("load").textContent="Couldn’t load your messages. Check your connection, or the latest Firestore rules may not be published yet."}
});
</script>
