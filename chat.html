 const ci=catOf(p),v=S.shops[p.sellerId]&&S.shops[p.sellerId].verified===true,sv=S.saves.has(p.id),img=safeImg(p.thumb),href="product.html?id="+encodeURIComponent(p.id);
 const st=p.stock==="out"?'<span class="no">Out of stock</span>':p.stock==="low"?'<span class="lo">Low stock</span>':'<span class="ok">In stock</span>';
 return '<article class="pc"><a class="im" href="'+href+'" style="background:'+TILE[ci%4]+'" aria-label="View '+esc(p.name)+'">'+(img?'<img src="'+img+'" alt="" loading="lazy">':art(ci))+'</a><button class="hv" data-sv="'+esc(p.id)+'" aria-pressed="'+sv+'" aria-label="Save '+esc(p.name)+'">'+I("heart")+'</button><div class="pb"><a href="'+href+'"><h3>'+esc(p.name)+'</h3></a><div class="pr">'+N(p.price)+'</div><div class="sh">'+esc(p.shopName)+(v?' <span class="vf">'+I("shield")+'Verified</span>':'')+'</div><div class="mt">'+I("pin")+' '+esc(p.city)+', '+esc(p.state)+'</div><div class="mt">'+st+' · '+ago(p.createdAt)+'</div></div></article>';
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-sv],[data-fl]");if(!t)return;
 e.preventDefault();
 const ok=t.dataset.sv?await toggleSave(t.dataset.sv):await toggleFollow(t.dataset.fl,t.dataset.n||"");
 if(ok&&typeof onSocial==="function")onSocial();
});

const qs=new URLSearchParams(location.search),toId=qs.get("to"),toShop=(qs.get("shop")||"").slice(0,80);
let me="",list=[],cur=null,unsub=null;
const other=c=>c.buyerId===S.u.uid?c.shopName:c.buyerName;
async function loadList(){
 const [a,b]=await Promise.all([getDocs(query(collection(db,"chats"),where("buyerId","==",S.u.uid))),getDocs(query(collection(db,"chats"),where("sellerId","==",S.u.uid)))]);
 const m={};[...a.docs,...b.docs].forEach(d=>m[d.id]={id:d.id,...d.data()});
 list=Object.values(m).sort((x,y)=>sec(y.lastAt)-sec(x.lastAt));
}
function showList(){
 if(unsub){unsub();unsub=null}cur=null;$("tv").hidden=true;$("lv").hidden=false;$("ti").textContent="Messages";$("bk").href="account.html";
 $("lv").innerHTML=list.length?list.map(c=>'<button class="li" data-o="'+esc(c.id)+'"><div class="av">'+esc(String(other(c)||"?").trim()[0].toUpperCase())+'</div><div class="sp"><b>'+esc(other(c))+'</b><div class="mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(c.lastFrom===S.u.uid?"You: ":"")+esc(c.lastText)+'</div></div><span class="t">'+ago(c.lastAt)+'</span></button>').join(""):'<div class="card empty">'+I("chat")+'<h3>No messages yet</h3><p>Open a product and tap “Message seller” to start a conversation.</p><a class="btn p" href="marketplace.html">Browse products</a></div>';
}
function paint(L){const e=$("ms");e.innerHTML=L.length?L.map(m=>'<div class="b'+(m.from===S.u.uid?" me":"")+'">'+esc(m.text)+'<small>'+hm(m.at)+'</small></div>').join(""):'<p class="mu" style="text-align:center">Say hello. Ask about price, stock or pickup.</p>';e.scrollTop=e.scrollHeight}
function sub(){if(unsub)unsub();unsub=onSnapshot(query(collection(db,"chats",cur.id,"messages"),orderBy("at","asc")),s=>paint(s.docs.map(d=>d.data())),()=>toast("Couldn’t load messages. Reload the page."))}
function openChat(c){
 cur=c;$("lv").hidden=true;$("tv").hidden=false;$("ti").textContent=other(c);$("bk").href="#";
 paint([]);if(!c.isNew)sub();$("mi").focus();
}
$("bk").onclick=e=>{if(cur){e.preventDefault();loadList().then(showList).catch(showList)}};
$("cf").onsubmit=async e=>{
 e.preventDefault();
 const t=$("mi").value.trim();if(!t||!cur)return;
 if(!navigator.onLine)return toast("No connection. Try again.");
 $("sd").disabled=true;
 try{
  const created=cur.isNew,txt=t.slice(0,1000);
  if(created){await setDoc(doc(db,"chats",cur.id),{buyerId:cur.buyerId,sellerId:cur.sellerId,buyerName:String(cur.buyerName).slice(0,60),shopName:String(cur.shopName).slice(0,80),lastText:txt.slice(0,200),lastAt:serverTimestamp(),lastFrom:S.u.uid});cur.isNew=false;sub()}
  const b=writeBatch(db);b.set(doc(collection(db,"chats",cur.id,"messages")),{from:S.u.uid,text:txt,at:serverTimestamp()});
  if(!created)b.update(doc(db,"chats",cur.id),{lastText:txt.slice(0,200),lastAt:serverTimestamp(),lastFrom:S.u.uid});
  await b.commit();$("mi").value="";
 }catch(x){toast(x.code==="permission-denied"?"You can’t message this seller.":"Message not sent. Please try again.")}
 $("sd").disabled=false;
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-o]");if(t){const c=list.find(x=>x.id===t.dataset.o);if(c)openChat(c)}});
onAuthStateChanged(auth,async u=>{
 if(!u)return location.replace("auth.html");
 S.u=u;
 try{
  try{const p=await getDoc(doc(db,"users",u.uid));me=p.exists()?p.data().name:""}catch(e){}
  me=me||u.displayName||"Buyer";
  await loadList();$("load").hidden=true;
  if(toId&&toId!==u.uid){
   let name=toShop;try{const s=await getDoc(doc(db,"shops",toId));if(s.exists())name=s.data().shopName}catch(e){}
   const ex=list.find(c=>c.buyerId===u.uid&&c.sellerId===toId);
   openChat(ex||{id:u.uid+"_"+toId,buyerId:u.uid,sellerId:toId,buyerName:me,shopName:name||"Seller",isNew:true});
  }else showList();
 }catch(e){$("load").hidden=false;$("load").textContent="Couldn’t load your messages. Check your connection, or the latest Firestore rules may not be published yet."}
});
</script>
