 try{if(S.saves.has(pid)){await deleteDoc(doc(db,"saves",id));S.saves.delete(pid);toast("Removed from saved")}else{await setDoc(doc(db,"saves",id),{userId:S.u.uid,pid,createdAt:serverTimestamp()});S.saves.add(pid);toast("Saved")}return true}
 catch(e){toast("Couldn’t update. Please try again.");return false}
}
async function toggleFollow(sid,name){
 if(!S.u){need();return false}
 if(sid===S.u.uid){toast("This is your own shop.");return false}
 const id=S.u.uid+"_"+sid;
 try{if(S.follows.has(sid)){await deleteDoc(doc(db,"follows",id));S.follows.delete(sid);toast("Unfollowed "+name)}else{await setDoc(doc(db,"follows",id),{buyerId:S.u.uid,sellerId:sid,shopName:String(name).slice(0,80),createdAt:serverTimestamp()});S.follows.set(sid,name);toast("Following "+name)}return true}
 catch(e){toast("Couldn’t update. Please try again.");return false}
}
function pcard(p){
 const ci=catOf(p),v=S.shops[p.sellerId]&&S.shops[p.sellerId].verified===true,sv=S.saves.has(p.id),img=safeImg(p.thumb),href="product.html?id="+encodeURIComponent(p.id);
 const st=p.stock==="out"?'<span class="no">Out of stock</span>':p.stock==="low"?'<span class="lo">Low stock</span>':'<span class="ok">In stock</span>';
 return '<article class="pc"><a class="im" href="'+href+'" style="background:'+TILE[ci%4]+'" aria-label="View '+esc(p.name)+'">'+(img?'<img src="'+img+'" alt="" loading="lazy">':art(ci))+'</a><button class="hv" data-sv="'+esc(p.id)+'" aria-pressed="'+sv+'" aria-label="Save '+esc(p.name)+'">'+I("heart")+'</button><div class="pb"><a href="'+href+'"><h3>'+esc(p.name)+'</h3></a><div class="pr">'+N(p.price)+'</div><div class="sh">'+esc(p.shopName)+(v?' <span class="vf">'+I("shield")+'Verified</span>':'')+'</div><div class="mt">'+I("pin")+' '+esc(p.city)+', '+esc(p.state)+'</div><div class="mt">'+st+' · '+ago(p.createdAt)+'</div></div></article>';
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-sv],[data-fl]");if(!t)return;
 e.preventDefault();
 const ok=t.dataset.sv?await toggleSave(t.dataset.sv):await toggleFollow(t.dataset.fl,t.dataset.n||"");
 if(ok&&typeof onSocial==="function")onSocial();
});

let PRODS=[],CH=[],route="home";
const stGet=()=>{try{return localStorage.getItem("nm_state")||""}catch(e){return""}};
const stSet=v=>{try{localStorage.setItem("nm_state",v)}catch(e){}};
const first=()=>String(S.name||S.u.displayName||"there").trim().split(/\s+/)[0];
const initials=s=>String(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const grid=L=>'<div class="grid">'+L.map(pcard).join("")+'</div>';
const section=(t,html,more)=>'<div class="sec"><h2>'+t+'</h2>'+(more?'<a href="'+more+'">See all</a>':'')+'</div>'+html;
function alerts(){
 const out=[],now=Date.now()/1000;
 PRODS.filter(p=>S.follows.has(p.sellerId)&&now-sec(p.createdAt)<14*86400).forEach(p=>out.push({t:sec(p.createdAt),ic:"store",h:"New from "+p.shopName,s:p.name+" · "+N(p.price),href:"product.html?id="+encodeURIComponent(p.id)}));
 CH.filter(c=>c.lastFrom&&c.lastFrom!==S.u.uid).forEach(c=>out.push({t:sec(c.lastAt),ic:"chat",h:(c.buyerId===S.u.uid?c.shopName:c.buyerName)+" sent a message",s:c.lastText,href:"chat.html"}));
 return out.sort((a,b)=>b.t-a.t);
}
const V={};
V.home=()=>{
 const st=stGet(),fl=PRODS.filter(p=>S.follows.has(p.sellerId)),near=st?PRODS.filter(p=>p.state===st):[],rv=recGet().map(id=>PRODS.find(p=>p.id===id)).filter(Boolean),
 ver=Object.entries(S.shops).filter(([k,s])=>s.verified===true&&s.status==="approved"),na=alerts().length;
 return '<div class="hero"><div class="wrap"><div class="top"><a class="logo" href="index.html"><i>N</i><span>Naija<b>Mart</b></span></a><button class="ib" data-r="alerts" aria-label="Alerts">'+I("bell")+(na?'<span class="n">'+na+'</span>':'')+'</button></div>'+
 '<div class="hi">Hello, '+esc(first())+'</div><div class="hs">Discover products from sellers across Nigeria.</div>'+
 '<label class="loc">'+I("pin")+'<select id="lc" aria-label="Your state"><option value="">All of Nigeria</option>'+STATES.map(s=>'<option'+(s===st?" selected":"")+'>'+s+'</option>').join("")+'</select></label>'+
 '<form class="sb" id="sf">'+I("search")+'<input id="q" type="search" placeholder="Search products, sellers and shops" aria-label="Search"><button>Search</button></form></div></div>'+
 '<div class="wrap">'+(S.u.emailVerified?'':'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill">Email not verified</span><span class="mu sp">Verify your email to keep your account safe.</span><button class="btn s" data-r="settings">Verify</button></div>')+
 section("Categories",'<div class="chips">'+CATS.map((c,i)=>'<a class="cat" href="marketplace.html?cat='+encodeURIComponent(c)+'"><span style="background:'+TILE[i%4]+'">'+art(i)+'</span>'+esc(c)+'</a>').join("")+'</div>')+
 (fl.length?section("New from shops you follow",grid(fl.slice(0,4)),"#"):"")+
 (PRODS.length?section("Recently added",grid(PRODS.slice(0,8)),"marketplace.html"):'<div class="card empty">'+I("store")+'<h3>Sellers are getting started</h3><p>New products appear here as sellers publish them.</p></div>')+
 (near.length?section("Near you · "+esc(st),grid(near.slice(0,4)),"marketplace.html?state="+encodeURIComponent(st)):"")+
 (ver.length?section("Verified sellers",'<div class="hz">'+ver.map(([k,s])=>'<div class="shc"><div class="av">'+esc(initials(s.shopName))+'</div><b>'+esc(s.shopName)+'</b> <span class="vf">'+I("shield")+'</span><div class="mt">'+esc(s.city)+', '+esc(s.state)+'</div><div class="row" style="margin-top:10px"><a class="btn s sp" href="marketplace.html?q='+encodeURIComponent(s.shopName)+'">Products</a><button class="btn s p sp" data-fl="'+esc(k)+'" data-n="'+esc(s.shopName)+'" aria-pressed="'+S.follows.has(k)+'">'+(S.follows.has(k)?"Following":"Follow")+'</button></div></div>').join("")+'</div>'):"")+
 (rv.length?section("Recently viewed",grid(rv.slice(0,4)),"#"):"")+'</div>';
};
const bar=(t,back)=>'<div class="wrap"><div class="tb">'+(back?'<button class="bk" data-r="'+back+'" aria-label="Back">'+I("back")+'</button>':'')+'<h2>'+t+'</h2></div>';
V.saved=()=>{const L=PRODS.filter(p=>S.saves.has(p.id));return bar("Saved products")+(L.length?grid(L):'<div class="card empty">'+I("heart")+'<h3>Nothing saved yet</h3><p>Tap the heart on any product to save it here.</p><a class="btn p" href="marketplace.html">Browse products</a></div>')+'</div>'};
V.recent=()=>{const L=recGet().map(id=>PRODS.find(p=>p.id===id)).filter(Boolean);return bar("Recently viewed","account")+(L.length?grid(L):'<div class="card empty">'+I("clock")+'<h3>No history yet</h3><p>Products you open will appear here.</p></div>')+'</div>'};
V.following=()=>{const L=[...S.follows.entries()];return bar("Following","account")+(L.length?L.map(([k,n])=>{const s=S.shops[k]||{},cnt=PRODS.filter(p=>p.sellerId===k).length;return '<div class="card"><div class="row"><div class="av">'+esc(initials(n))+'</div><div class="sp"><b>'+esc(n)+'</b> '+(s.verified===true?'<span class="vf">'+I("shield")+'Verified</span>':'')+'<div class="mu">'+cnt+' product'+(cnt===1?"":"s")+'</div></div></div><div class="row" style="margin-top:10px"><a class="btn s sp" href="marketplace.html?q='+encodeURIComponent(n)+'">Products</a><a class="btn s sp" href="chat.html?to='+encodeURIComponent(k)+'&shop='+encodeURIComponent(n)+'">Message</a><button class="btn s r sp" data-fl="'+esc(k)+'" data-n="'+esc(n)+'">Unfollow</button></div></div>'}).join(""):'<div class="card empty">'+I("store")+'<h3>You’re not following any shops</h3><p>Open a product and tap Follow to see new products from that shop here.</p></div>')+'</div>'};
V.alerts=()=>{const L=alerts();return bar("Notifications","account")+'<div class="card">'+(L.length?L.map(a=>'<a class="al" href="'+a.href+'"><span class="d">'+I(a.ic)+'</span><div class="sp"><b>'+esc(a.h)+'</b><div class="mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.s)+'</div></div><span class="mu">'+ago({seconds:a.t})+'</span></a>').join(""):'<div class="empty">'+I("bell")+'<h3>All caught up</h3><p>New products from shops you follow and new messages will show here.</p></div>')+'</div></div>'};
V.account=()=>{
 const u=S.u,nm=S.name||u.displayName||"Buyer",na=alerts().length;
 return '<div class="hero"><div class="wrap"><div class="top"><a class="logo" href="index.html"><i>N</i><span>Naija<b>Mart</b></span></a></div><div class="row" style="margin-top:16px"><div class="av" style="width:64px;height:64px;font-size:1.3rem">'+esc(initials(nm))+'</div><div class="sp"><div class="hi" style="margin:0">'+esc(nm)+'</div><div class="hs">'+esc(u.email)+'</div>'+(stGet()?'<div class="hs">'+I("pin")+' '+esc(stGet())+'</div>':'')+'</div></div></div></div>'+
 '<div class="wrap"><div class="st"><div><b>'+S.saves.size+'</b><small>Saved</small></div><div><b>'+S.follows.size+'</b><small>Following</small></div><div><b>'+recGet().length+'</b><small>Viewed</small></div></div>'+
 '<div class="card" style="padding:4px 16px">'+
 [["saved","heart","Saved products"],["recent","clock","Recently viewed"],["following","store","Following"],["alerts","bell","Notifications"+(na?" ("+na+")":"")]].map(x=>'<button class="mi" data-r="'+x[0]+'">'+I(x[1])+x[2]+I("chev").replace('<svg','<svg style="margin-left:auto"')+'</button>').join("")+
 '<a class="mi" href="chat.html">'+I("chat")+'Messages'+I("chev").replace('<svg','<svg style="margin-left:auto"')+'</a>'+
 [["settings","gear","Settings"],["help","help","Help and support"]].map(x=>'<button class="mi" data-r="'+x[0]+'">'+I(x[1])+x[2]+I("chev").replace('<svg','<svg style="margin-left:auto"')+'</button>').join("")+
 [["box","My orders"],["flag","My reviews"],["pin","Addresses"]].map(x=>'<div class="mi" style="cursor:default;color:var(--mu)">'+I(x[0])+x[1]+'<span class="s">SOON</span></div>').join("")+
 '<button class="mi" data-out="1" style="color:var(--rd)">'+I("logout")+'Log out</button></div>'+
 '<p class="note">Orders, reviews and addresses are marked Soon because Naija Mart doesn’t process orders yet. Buyers and sellers arrange purchases directly.</p></div>';
};
V.settings=()=>bar("Settings","account")+'<div class="msg" id="gm" role="alert"></div>'+
 (S.u.emailVerified?'':'<div class="card"><span class="pill">Email not verified</span><p class="mu">Open the link we emailed you, then tap the button.</p><div class="row"><button class="btn p sp" id="chk">I’ve verified</button><button class="btn sp" id="rs">Resend email</button></div></div>')+
 '<div class="card"><h3 style="margin-bottom:10px">Your profile</h3><label class="f" for="pn">Full name</label><input class="in" id="pn" value="'+esc(S.name)+'"><label class="f" for="pp">Phone number</label><input class="in" id="pp" type="tel" value="'+esc(S.phone||"")+'"><label class="f" for="ps">Your state</label><select class="in" id="ps"><option value="">All of Nigeria</option>'+STATES.map(s=>'<option'+(s===stGet()?" selected":"")+'>'+s+'</option>').join("")+'</select><button class="btn p w" id="sv">Save changes</button></div>'+
 '<p class="mu" style="text-align:center">Sell on Naija Mart? <a href="auth.html?role=seller" style="color:var(--g2);font-weight:700">Use the seller sign-in</a></p></div>';
V.help=()=>bar("Help and support","account")+'<div class="card"><h3>How it works</h3><p class="mu">Browse products, follow shops you like, then message the seller to agree price, pickup or delivery. Naija Mart doesn’t take payment or guarantee delivery.</p></div><div class="card"><h3>Stay safe</h3><p class="mu">Never pay in advance to someone you can’t verify. Meet in public places. Report suspicious listings from the product page.</p></div><div class="card"><h3>Contact support</h3><p class="mu">A support inbox is coming soon. For now, use Report on a product or message the seller.</p></div></div>';
function render(){
 const f=V[route]||V.home;$("v").innerHTML=f();
 const nv=[["home","home","Home"],["browse","search","Browse"],["msg","chat","Messages"],["saved","heart","Saved"],["account","user","Account"]];
 $("bn").firstElementChild.innerHTML=nv.map(n=>n[0]==="browse"?'<a href="marketplace.html">'+I(n[1])+n[2]+'</a>':n[0]==="msg"?'<a href="chat.html">'+I(n[1])+n[2]+'</a>':'<button data-r="'+n[0]+'"'+((route===n[0]||(n[0]==="account"&&["recent","following","alerts","settings","help"].includes(route)))?' aria-current="true"':'')+'>'+I(n[1])+n[2]+'</button>').join("");
 window.scrollTo(0,0);
}
function go(r){if(location.hash==="#"+r)route=r,render();else location.hash="#"+r}
addEventListener("hashchange",()=>{route=(location.hash||"#home").slice(1);if(!V[route])route="home";render()});
function onSocial(){const y=window.scrollY;render();window.scrollTo(0,y)}
const say=(t,k)=>{const m=$("gm");if(m){m.textContent=t;m.className="msg "+k}else toast(t)};
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-r],[data-out],#sv,#chk,#rs");if(!t)return;
 if(t.dataset.r)return go(t.dataset.r);
 if(t.dataset.out)return signOut(auth).then(()=>location.replace("auth.html"));
 if(t.id==="sv"){const n=$("pn").value.trim(),p=$("pp").value.trim();if(!n)return say("Enter your name.","err");t.disabled=true;try{await updateDoc(doc(db,"users",S.u.uid),{name:n,phone:p});await updateProfile(S.u,{displayName:n});S.name=n;S.phone=p;stSet($("ps").value);say("Saved.","ok")}catch(x){say("Couldn’t save. Please try again.","err")}t.disabled=false;return}
 if(t.id==="chk"){await S.u.reload();await S.u.getIdToken(true);S.u=auth.currentUser;if(S.u.emailVerified){toast("Email verified. Thank you!");render()}else say("Not verified yet. Open the link in your email, then try again.","warn");return}
 if(t.id==="rs"){try{await sendEmailVerification(S.u);say("Verification email sent. Check your inbox and spam.","ok")}catch(x){say("Please wait a moment and try again.","warn")}}
});
document.addEventListener("submit",e=>{if(e.target.id==="sf"){e.preventDefault();const q=$("q").value.trim(),p=new URLSearchParams();if(q)p.set("q",q);if(stGet())p.set("state",stGet());location.href="marketplace.html"+(p.toString()?"?"+p:"")}});
document.addEventListener("change",e=>{if(e.target.id==="lc"){stSet(e.target.value);render()}});
onAuthStateChanged(auth,async u=>{
 if(!u)return location.replace("auth.html");
 S.u=u;
 try{
  await u.reload();S.u=auth.currentUser;
  const [p,a]=await Promise.allSettled([getDocs(query(collection(db,"products"),where("status","==","active"),limit(120))),loadShops()]);
  PRODS=p.status==="fulfilled"?p.value.docs.map(norm).sort((x,y)=>sec(y.createdAt)-sec(x.createdAt)):[];
  await loadSocial();
  try{const c=await getDocs(query(collection(db,"chats"),where("buyerId","==",S.u.uid)));CH=c.docs.map(d=>d.data())}catch(e){}
  try{const pr=await getDoc(doc(db,"users",S.u.uid));S.phone=pr.exists()?pr.data().phone:""}catch(e){}
  route=(location.hash||"#home").slice(1);if(!V[route])route="home";
  $("bn").hidden=false;render();
 }catch(e){$("v").innerHTML='<div class="wrap"><div class="card empty"><h3>Couldn’t load your account</h3><p>Check your connection, or the latest Firestore rules may not be published yet.</p></div></div>'}
});
</script>
