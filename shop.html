 const ci=catOf(p),v=S.shops[p.sellerId]&&S.shops[p.sellerId].verified===true,sv=S.saves.has(p.id),img=safeImg(p.thumb),href="product.html?id="+encodeURIComponent(p.id);
 const st=p.stock==="out"?'<span class="no">Out of stock</span>':p.stock==="low"?'<span class="lo">Low stock</span>':'<span class="ok">In stock</span>';
 return '<article class="pc"><a class="im" href="'+href+'" style="background:'+TILE[ci%4]+'" aria-label="View '+esc(p.name)+'">'+(img?'<img src="'+img+'" alt="" loading="lazy">':art(ci))+'</a><button class="hv" data-sv="'+esc(p.id)+'" aria-pressed="'+sv+'" aria-label="Save '+esc(p.name)+'">'+I("heart")+'</button><div class="pb"><a href="'+href+'"><h3>'+esc(p.name)+'</h3></a><div class="pr">'+N(p.price)+'</div><div class="sh"><a href="shop.html?id='+encodeURIComponent(p.sellerId)+'">'+esc(p.shopName)+'</a>'+(v?' <span class="vf">'+I("shield")+'Verified</span>':'')+'</div><div class="mt">'+I("pin")+' '+esc(p.city)+', '+esc(p.state)+'</div><div class="mt">'+st+' · '+ago(p.createdAt)+'</div></div></article>';
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-sv],[data-fl]");if(!t)return;
 e.preventDefault();
 const ok=t.dataset.sv?await toggleSave(t.dataset.sv):await toggleFollow(t.dataset.fl,t.dataset.n||"");
 if(ok&&typeof onSocial==="function")onSocial();
});

const id=new URLSearchParams(location.search).get("id"),M=$("m");
let SH=null,L=[],booted=false;
function gone(t){$("hd").innerHTML="";M.innerHTML='<div class="card empty" style="margin-top:20px">'+I("store")+'<h3>'+(t||"Shop not available")+'</h3><p>This shop may not be approved yet, or the link is wrong.</p><a class="btn p" href="marketplace.html">Back to marketplace</a></div>'}
function paint(){
 const v=SH.verified===true,fl=S.follows.has(id),own=S.u&&S.u.uid===id,ci=Math.max(0,CATS.indexOf(SH.category)),name=esc(SH.shopName);
 $("hd").innerHTML='<div class="row" style="gap:14px"><div class="lt" style="background:'+TILE[ci%4]+'">'+art(ci)+'</div><div class="sp"><h1>'+name+'</h1><div class="s">'+I("pin")+' '+esc(SH.city)+', '+esc(SH.state)+'</div><div style="margin-top:8px">'+(v?'<span class="pl">'+I("shield")+' Verified seller</span>':'<span class="s">Not verified</span>')+'</div></div></div>';
 M.innerHTML='<div class="acts">'+(own?'<a class="btn p full" href="seller.html">Open my seller dashboard</a>':'<button class="btn p" data-fl="'+esc(id)+'" data-n="'+name+'" aria-pressed="'+fl+'">'+(fl?"Following":"Follow")+'</button><a class="btn" href="chat.html?to='+encodeURIComponent(id)+'&shop='+encodeURIComponent(SH.shopName)+'">'+I("chat")+' Message</a>')+'<button class="btn full" id="sh">'+I("share")+' Share this shop</button></div>'+
 '<div class="card"><dl style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0"><dt class="mu">Category</dt><dd style="margin:0;font-weight:600">'+esc(SH.category||"–")+'</dd><dt class="mu">Location</dt><dd style="margin:0;font-weight:600">'+esc(SH.area||"")+(SH.area?", ":"")+esc(SH.city)+', '+esc(SH.state)+'</dd><dt class="mu">Live products</dt><dd style="margin:0;font-weight:600">'+L.length+'</dd></dl></div>'+
 '<div class="sec"><h2>Products</h2></div>'+(L.length?'<div class="grid">'+L.map(pcard).join("")+'</div>':'<div class="card empty">'+I("box")+'<h3>No products yet</h3><p>This seller hasn’t published any products.</p></div>')+
 '<div class="note">Naija Mart doesn’t take payment or guarantee delivery. Confirm price and stock with the seller, and never pay in advance to someone you can’t verify.</div>';
}
async function boot(){
 if(!id)return gone();
 try{
  const s=await getDoc(doc(db,"shops",id));
  if(!s.exists()||s.data().status!=="approved")return gone();
  SH=s.data();S.shops[id]=SH;document.title=SH.shopName+" – Naija Mart";
  const p=await getDocs(query(collection(db,"products"),where("sellerId","==",id),where("status","==","active")));
  L=p.docs.map(norm).sort((a,b)=>sec(b.createdAt)-sec(a.createdAt));
  paint();
 }catch(e){gone("Couldn’t load this shop. Check your connection.")}
}
function onSocial(){if(SH)paint()}
document.addEventListener("click",async e=>{
 if(!e.target.closest("#sh"))return;
 const d={title:SH.shopName+" on Naija Mart",url:location.href};
 if(navigator.share)navigator.share(d).catch(()=>{});else{try{await navigator.clipboard.writeText(location.href);toast("Link copied")}catch(x){toast("Copy this page’s address to share it")}}
});
onAuthStateChanged(auth,async u=>{S.u=u;if(u)await loadSocial();if(!booted){booted=true;boot()}else if(SH)paint()});
</script>
</body>
</html>
