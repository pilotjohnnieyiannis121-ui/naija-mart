/* ---------- photos ---------- */
function shrink(src,max,q){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>rej(new Error("bad image"));im.src=src})}
async function fromFile(f){const u=URL.createObjectURL(f);try{let full=await shrink(u,800,.72);if(full.length>200000)full=await shrink(u,640,.55);return{full,thumb:await shrink(u,320,.6)}}finally{URL.revokeObjectURL(u)}}
function cropJpeg(file,w,h,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.max(w/im.width,h/im.height),sw=w/r,sh=h/r,c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function fmsg(t,k){const m=$("fm");if(m){m.textContent=t;m.className="msg "+k;m.scrollIntoView({block:"center",behavior:"smooth"})}else toast(t)}
function repaintPhotos(){const e=$("pvs");if(e)e.innerHTML=prevThumbs()+'<label class="up">'+I("camera")+'Add photos<input id="pf" type="file" accept="image/*" multiple></label>'}

/* ---------- product form ---------- */
function validate(){
 const d=S.form,q=Number(d.qty);
 if(String(d.name).trim().length<2)return "Enter the product name.";
 if(d.price===""||!(Number(d.price)>=0))return "Enter the price in naira.";
 if(d.cat==="")return "Choose a category.";
 if(!Number.isInteger(q)||q<0)return "Enter the stock quantity (0 or more).";
 if(!String(d.desc).trim())return "Add a short description.";
 if(!String(d.city).trim()||!String(d.area).trim())return "Enter the city and market or area.";
 return "";
}

async function publish(){
 const b=$("pub");b.disabled=true;
 const d=S.form,qty=Number(d.qty),stock=qty<=0?"out":qty<=3?"low":"in";
 const f={name:d.name.trim(),price:Math.round(Number(d.price)),cat:+d.cat,state:d.state,city:d.city.trim(),area:d.area.trim(),cond:d.cond,stock,qty,brand:d.brand.trim(),desc:d.desc.trim(),options:d.options.trim(),delivery:d.delivery,thumb:S.imgs[0]?S.imgs[0].thumb:"",photoCount:S.imgs.length};
 if(!navigator.onLine){b.disabled=false;$("dg").close();return fmsg("No connection. Check your internet and try again.","err")}
 try{
  let id=S.ed;
  if(id){await updateDoc(doc(db,"products",id),{...f,updatedAt:serverTimestamp()})}
  else{const r=doc(collection(db,"products"));id=r.id;await setDoc(r,{sellerId:S.u.uid,shopName:S.app.shopName,...f,status:"active",createdAt:serverTimestamp()})}
  let ok=true;
  if(!S.ed||S.pch){const bt=writeBatch(db);for(let i=0;i<3;i++){const r=doc(db,"products",id,"photos",String(i));if(i<S.imgs.length)bt.set(r,{data:S.imgs[i].full,idx:i});else if(S.ed)bt.delete(r)}try{await bt.commit()}catch(x){ok=false}}
  $("dg").close();await loadProducts();S.f="all";S.q="";const was=S.ed;S.ed=null;go("products");
  toast(ok?(was?"Saved. Your changes are live.":"Published! Your product is live."):"Saved, but the photos didn’t upload. Edit it to add them again.");
 }catch(x){$("dg").close();fmsg(x.code==="permission-denied"?"Not allowed. Your shop must be approved, and the latest Firestore rules must be published.":"Couldn’t save. Check your connection and try again. Nothing was published.","err")}
 b.disabled=false;
}
async function prodAct(id,a){
 const p=S.prods.find(x=>x.id===id);if(!p)return;$("dg").close();
 try{
  if(a==="del"){if(!await ask("Delete this product?",p.name+" will be removed for good."))return;const b=writeBatch(db);for(let i=0;i<3;i++)b.delete(doc(db,"products",id,"photos",String(i)));b.delete(doc(db,"products",id));await b.commit();toast("Product deleted.")}
  else if(a==="hide"){const s=p.status==="hidden"?"active":"hidden";await updateDoc(doc(db,"products",id),{status:s,updatedAt:serverTimestamp()});toast(s==="hidden"?"Hidden from buyers.":"Visible to buyers again.")}
  else if(a==="stk"){const out=p.stock!=="out",q=Number.isInteger(p.qty)?p.qty:0;await updateDoc(doc(db,"products",id),out?{stock:"out",qty:0,updatedAt:serverTimestamp()}:{stock:"in",qty:Math.max(q,1),updatedAt:serverTimestamp()});toast(out?"Marked out of stock.":"Marked available.")}
  await loadProducts();render();
 }catch(x){toast("That didn’t work. Nothing was changed. Please try again.")}
}

async function saveProfile(){
 const bio=$("pb").value.trim().slice(0,200),un=$("pu").value.trim().toLowerCase().replace(/^@/,""),old=S.pf.username||"";
 if(un&&!/^[a-z0-9_]{3,20}$/.test(un))return fmsg("Username must be 3–20 letters, numbers or underscores.","err");
 try{
  const b=writeBatch(db);
  if(un&&un!==old){const t=await getDoc(doc(db,"usernames",un));if(t.exists()&&t.data().uid!==S.u.uid)return fmsg("That username is taken. Try another.","err");if(!t.exists())b.set(doc(db,"usernames",un),{uid:S.u.uid});if(old)b.delete(doc(db,"usernames",old))}
  if(!un&&old)b.delete(doc(db,"usernames",old));
  const data={bio,username:un,avatar:S.eav??S.pf.avatar??"",cover:S.ecv??S.pf.cover??"",updatedAt:serverTimestamp()};
  b.set(doc(db,"profiles",S.u.uid),data);
  await b.commit();S.pf={...data};S.eav=S.ecv=null;toast("Profile saved.");go("profile");
 }catch(x){fmsg(x.code==="permission-denied"?"Couldn’t save. The latest Firestore rules must be published first.":"Couldn’t save your profile. Check your connection and try again.","err")}
}
async function shareShop(){const u=new URL("shop.html?id="+S.u.uid,location.href).href,d={title:S.app.shopName+" on Naija Mart",url:u};if(navigator.share)navigator.share(d).catch(()=>{});else{try{await navigator.clipboard.writeText(u);toast("Shop link copied")}catch(e){toast(u)}}}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-go],[data-new],[data-f],[data-ed],[data-del],[data-hide],[data-stk],[data-prev],[data-rm],[data-close],[data-out],[data-sq],[data-sh],[data-pt],[data-shr],[data-sp],[data-sa],[data-pw],[data-su],[data-pr],#pub");if(!t)return;
 const d=t.dataset;
 if(t.id==="pub")return publish();
 if(d.go==="out"||d.out)return signOut(auth).then(()=>location.replace("auth.html"));
 if(d.go)return go(d.go);
 if(d.new)return newP();
 if(d.f){S.f=d.f;return render()}
 if(d.sq){S.sq=!S.sq;render();const q=$("qs");if(q)q.focus();return}
 if(d.sh)return sheet(d.sh);
 if(d.ed){$("dg").close();return startEdit(d.ed)}
 if(d.del)return prodAct(d.del,"del");
 if(d.hide)return prodAct(d.hide,"hide");
 if(d.stk)return prodAct(d.stk,"stk");
 if(d.prev)return preview();
 if(d.rm!==undefined){S.imgs.splice(+d.rm,1);S.pch=true;return repaintPhotos()}
 if(d.close!==undefined)return $("dg").close();
 if(d.pt){S.pt=d.pt;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(d.shr!==undefined)return shareShop();
 if(d.sp!==undefined){t.disabled=true;await saveProfile();t.disabled=false;return}
 if(d.sa!==undefined){const n=$("an").value.trim(),p=$("ap").value.trim();if(!n)return fmsg("Enter your name.","err");t.disabled=true;try{await updateDoc(doc(db,"users",S.u.uid),{name:n,phone:p});S.prof={...S.prof,name:n,phone:p};fmsg("Saved.","ok")}catch(x){fmsg("Couldn’t save. Please try again.","err")}t.disabled=false;return}
 if(d.pw!==undefined){try{await sendPasswordResetEmail(auth,S.u.email);toast("Password reset email sent. Check your inbox and spam.")}catch(x){toast("Couldn’t send the email. Try again in a moment.")}return}
 if(d.su!==undefined){const m=$("sm").value.trim();if(m.length<5)return fmsg("Please write a few words about the problem.","err");t.disabled=true;try{await addDoc(collection(db,"supportRequests"),{uid:S.u.uid,email:S.u.email||"",topic:$("st").value,message:m.slice(0,800),createdAt:serverTimestamp()});$("sm").value="";fmsg("Sent. The Naija Mart team will review it.","ok")}catch(x){fmsg("Couldn’t send. The latest Firestore rules must be published first.","err")}t.disabled=false;return}
 if(d.pr!==undefined){t.disabled=true;try{await setDoc(doc(db,"premiumRequests",S.u.uid),{uid:S.u.uid,note:"",status:"requested",createdAt:serverTimestamp()});S.preq=true;render();toast("Request sent. We’ll contact you.")}catch(x){t.disabled=false;fmsg("Couldn’t send your request. The latest Firestore rules must be published first.","err")}}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.k)S.form[t.dataset.k]=t.value;if(t.id==="qs"){S.q=t.value;$("pg").innerHTML=plist()}});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.dataset.k)S.form[t.dataset.k]=t.value;
 if(t.dataset.th){try{localStorage.setItem("nm_theme",t.dataset.th)}catch(x){}document.documentElement.dataset.theme=t.dataset.th;return}
 if(t.id==="shw"){const v=t.checked;setDoc(doc(db,"presence",S.u.uid),{show:v,lastSeen:serverTimestamp()},{merge:true}).then(()=>{S.show=v;toast(v?"Last seen is visible":"Last seen is hidden")}).catch(()=>{t.checked=!v;toast("Couldn’t save that setting.")});return}
 if(t.id==="fav"||t.id==="fcv"){
  const f=t.files[0];t.value="";if(!f)return;if(!f.type.startsWith("image/")||f.size>15e6)return fmsg("Choose a photo under 15 MB.","err");
  try{
   if(t.id==="fav"){let d=await cropJpeg(f,240,240,.78);if(d.length>55000)d=await cropJpeg(f,200,200,.6);S.eav=d;const p=$("avp");if(p)p.innerHTML='<div class="av" style="width:76px;height:76px;background:#fff"><img src="'+d+'" alt=""></div>'}
   else{let d=await cropJpeg(f,900,380,.7);if(d.length>150000)d=await cropJpeg(f,720,304,.55);S.ecv=d;const p=$("cvp");if(p){const l=p.querySelector("label");p.innerHTML='<img src="'+d+'" alt="">';p.appendChild(l)}}
  }catch(x){fmsg("Couldn’t read that photo. Try another.","err")}
  return;
 }
 if(t.id==="pf"){
  const fl=[...t.files];t.value="";
  for(const f of fl){
   if(S.imgs.length>=3){fmsg("You can add up to 3 photos.","err");break}
   if(!f.type.startsWith("image/")||f.size>15e6){fmsg("Choose a photo under 15 MB.","err");continue}
   try{S.imgs.push(await fromFile(f));S.pch=true}catch(x){fmsg("Couldn’t read that photo. Try another.","err")}
  }
  repaintPhotos();
 }
});
addEventListener("hashchange",()=>{if(S.app&&S.app.status==="approved")route()});
const beat=()=>{if(S.u&&document.visibilityState==="visible")setDoc(doc(db,"presence",S.u.uid),{lastSeen:serverTimestamp()},{merge:true}).catch(()=>{})};
setTimeout(beat,6000);setInterval(beat,120000);addEventListener("visibilitychange",beat);

onAuthStateChanged(auth,async u=>{
 if(!u)return location.replace("auth.html?role=seller");
 S.u=u;
 try{
  const a=await getDoc(doc(db,"sellerApplications",u.uid));
  if(!a.exists()){$("load").hidden=true;$("v").hidden=false;$("v").innerHTML=logoBar().replace(bellBtn(),"")+'<div class="pad"><div class="card"><h2>You haven’t applied yet</h2><p class="mu">Tell us about your shop to start selling.</p><a class="btn p w" href="apply.html">Apply to sell</a></div></div>';return}
  S.app=a.data();
  try{const p=await getDoc(doc(db,"users",u.uid));S.prof=p.exists()?p.data():{}}catch(e){}
  if(S.app.status!=="approved"){$("load").hidden=true;$("v").hidden=false;$("v").innerHTML=statusPage(S.app);return}
  try{await loadProducts()}catch(e){$("v").hidden=false;$("load").hidden=true;$("v").innerHTML=hb("Seller dashboard")+'<div class="pad"><div class="card empty"><h3>Couldn’t load your products</h3><p>Check your connection, or the latest Firestore rules may not be published yet.</p></div></div>';return}
  const [pf,sh,fl,fg,ch,pq]=await Promise.allSettled([getDoc(doc(db,"profiles",u.uid)),getDoc(doc(db,"shops",u.uid)),getDocs(query(collection(db,"follows"),where("sellerId","==",u.uid))),getDocs(query(collection(db,"follows"),where("buyerId","==",u.uid))),getDocs(query(collection(db,"chats"),where("sellerId","==",u.uid))),getDoc(doc(db,"premiumRequests",u.uid))]);
  S.pf=pf.status==="fulfilled"&&pf.value.exists()?pf.value.data():{};
  S.shop=sh.status==="fulfilled"&&sh.value.exists()?sh.value.data():{};
  if(fl.status==="fulfilled"){S.fol=fl.value.size;S.fl=fl.value.docs.map(d=>d.data())}
  if(fg.status==="fulfilled")S.fing=fg.value.size;
  if(ch.status==="fulfilled")S.ch=ch.value.docs.map(d=>d.data());
  S.preq=pq.status==="fulfilled"&&pq.value.exists();
  try{if(S.fol!==null){const st=await getDoc(doc(db,"shopStats",u.uid));const cur=st.exists()?st.data().followers:null;if(cur!==S.fol)await setDoc(doc(db,"shopStats",u.uid),{followers:S.fol})}}catch(e){}
  try{const p2=await getDoc(doc(db,"presence",u.uid));S.show=p2.exists()?p2.data().show!==false:true}catch(e){}
  $("load").hidden=true;$("v").hidden=false;$("bn").hidden=false;route();
 }catch(e){$("load").textContent="Couldn’t load your dashboard. Check your connection and reload."}
});
</script>
