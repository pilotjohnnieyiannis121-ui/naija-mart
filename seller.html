@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
[hidden]{display:none!important}

function shrink(src,max,q){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>rej(new Error("bad image"));im.src=src})}
async function fromFile(f){const u=URL.createObjectURL(f);try{let full=await shrink(u,800,.72);if(full.length>200000)full=await shrink(u,640,.55);return{full,thumb:await shrink(u,320,.6)}}finally{URL.revokeObjectURL(u)}}
function fmsg(t,k){const m=$("fm");if(m){m.textContent=t;m.className="msg "+k;m.scrollIntoView({block:"center",behavior:"smooth"})}else toast(t)}
function repaintPhotos(){const e=$("pvs");if(e)e.innerHTML=prevThumbs()+'<label class="up">'+I("camera")+'Add photos<input id="pf" type="file" accept="image/*" multiple></label>'}

/* ---------- form actions ---------- */
function validate(){
 const d=S.form,q=Number(d.qty);
 if(String(d.name).trim().length<2)return "Enter the product name.";
 if(d.price===""||!(Number(d.price)>=0))return "Enter the price in naira.";
 if(d.cat==="")return "Choose a category.";
 if(!Number.isInteger(q)||q<0)return "Enter the stock quantity (0 or more).";
 if(!String(d.desc).trim())return "Add a short description.";
 if(!String(d.city).trim()||!String(d.area).trim())return "Enter the city and market or area.";
 return "";
}
function preview(){
 const e=validate();if(e)return fmsg(e,"err");
 const d=S.form,ci=+d.cat;
 $("dp").innerHTML='<h3 style="margin-bottom:10px">Preview</h3><p class="mu" style="margin:0 0 10px">This is how buyers will see your product.</p><div class="grid" style="grid-template-columns:1fr"><article class="pc"><div class="im" style="background:'+TILE[ci%4]+'">'+(S.imgs[0]?'<img src="'+S.imgs[0].thumb+'" alt="">':art(ci))+'<span class="st">Active</span></div><div class="pb"><h3>'+esc(d.name)+'</h3><div class="pr">'+N(d.price)+'</div><div class="mt">'+esc(CATS[ci])+(d.brand?" · "+esc(d.brand):"")+' · '+esc(d.cond)+'</div><div class="mt">'+esc(d.qty)+' in stock · '+esc(d.delivery)+'</div><div class="mt">'+esc(d.area)+', '+esc(d.city)+', '+esc(d.state)+'</div>'+(d.options?'<div class="mt">'+esc(d.options)+'</div>':'')+'<p class="mt" style="margin:6px 0 0">'+esc(d.desc)+'</p></div></article></div><div class="row" style="margin-top:14px"><button class="btn sp" data-close="1">Back to edit</button><button class="btn g sp" id="pub">'+(S.ed?"Save changes":"Publish product")+'</button></div>';
 $("dg").showModal();
}
async function publish(){
 const b=$("pub");b.disabled=true;
 const d=S.form,qty=Number(d.qty),stock=qty<=0?"out":qty<=3?"low":"in";
 const f={name:d.name.trim(),price:Math.round(Number(d.price)),cat:+d.cat,state:d.state,city:d.city.trim(),area:d.area.trim(),cond:d.cond,stock,qty,brand:d.brand.trim(),desc:d.desc.trim(),options:d.options.trim(),delivery:d.delivery,thumb:S.imgs[0]?S.imgs[0].thumb:"",photoCount:S.imgs.length};
 if(!navigator.onLine){b.disabled=false;return fmsg("No connection. Check your internet and try again.","err"),$("dg").close()}
 try{
  let id=S.ed;
  if(id){await updateDoc(doc(db,"products",id),{...f,updatedAt:serverTimestamp()})}
  else{const r=doc(collection(db,"products"));id=r.id;await setDoc(r,{sellerId:S.u.uid,shopName:S.app.shopName,...f,status:"active",createdAt:serverTimestamp()})}
  let ok=true;
  if(!S.ed||S.pch){const bt=writeBatch(db);for(let i=0;i<3;i++){const r=doc(db,"products",id,"photos",String(i));if(i<S.imgs.length)bt.set(r,{data:S.imgs[i].full,idx:i});else if(S.ed)bt.delete(r)}try{await bt.commit()}catch(x){ok=false}}
  $("dg").close();await loadProducts();S.f="all";S.q="";const was=S.ed;S.ed=null;go("products");
  toast(ok?(was?"Saved. Your changes are live.":"Published! Your product is live."):"Saved, but the photos didn’t upload. Edit it to add them again.");
 }catch(x){$("dg").close();fmsg(x.code==="permission-denied"?"Not allowed. Your shop must be approved, and the latest Firestore rules must be published.":"Couldn’t save. Check your connection and try again. Nothing was published.","err")}
 b.disabled=false;
}
async function prodAct(id,a){
 const p=S.prods.find(x=>x.id===id);if(!p)return;
 try{
  if(a==="del"){if(!await ask("Delete this product?",p.name+" will be removed for good."))return;const b=writeBatch(db);for(let i=0;i<3;i++)b.delete(doc(db,"products",id,"photos",String(i)));b.delete(doc(db,"products",id));await b.commit();toast("Product deleted.")}
  else if(a==="hide"){const s=p.status==="hidden"?"active":"hidden";await updateDoc(doc(db,"products",id),{status:s,updatedAt:serverTimestamp()});toast(s==="hidden"?"Hidden from buyers.":"Visible to buyers again.")}
  else if(a==="stk"){const out=p.stock!=="out",q=Number.isInteger(p.qty)?p.qty:0;await updateDoc(doc(db,"products",id),out?{stock:"out",qty:0,updatedAt:serverTimestamp()}:{stock:"in",qty:Math.max(q,1),updatedAt:serverTimestamp()});toast(out?"Marked out of stock.":"Marked available.")}
  await loadProducts();render();
 }catch(x){toast("That didn’t work. Nothing was changed. Please try again.")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-go],[data-new],[data-f],[data-ed],[data-del],[data-hide],[data-stk],[data-prev],[data-rm],[data-close],[data-out],#pub");if(!t)return;
 const d=t.dataset;
 if(t.id==="pub")return publish();
 if(d.go)return go(d.go);
 if(d.new)return newP();
 if(d.f){S.f=d.f;return render()}
 if(d.ed)return startEdit(d.ed);
 if(d.del)return prodAct(d.del,"del");
 if(d.hide)return prodAct(d.hide,"hide");
 if(d.stk)return prodAct(d.stk,"stk");
 if(d.prev)return preview();
 if(d.rm!==undefined){S.imgs.splice(+d.rm,1);S.pch=true;return repaintPhotos()}
 if(d.close)return $("dg").close();
 if(d.out)return signOut(auth).then(()=>location.replace("auth.html"));
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.k)S.form[t.dataset.k]=t.value;if(t.id==="qs"){S.q=t.value;$("pg").innerHTML=plist()}});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.dataset.k)S.form[t.dataset.k]=t.value;
 if(t.id==="so"){S.sort=t.value;$("pg").innerHTML=plist()}
 if(t.id==="pf"){
  const fl=[...t.files];t.value="";
  for(const f of fl){
   if(S.imgs.length>=3){fmsg("You can add up to 3 photos.","err");break}
   if(!f.type.startsWith("image/")||f.size>15e6){fmsg("Choose a photo under 15 MB.","err");continue}
   try{S.imgs.push(await fromFile(f));S.pch=true}catch(x){fmsg("Couldn’t read that photo. Try another.","err")}
  }
  repaintPhotos();
 }
});
addEventListener("hashchange",()=>{if(S.app&&S.app.status==="approved")route()});

onAuthStateChanged(auth,async u=>{
 if(!u)return location.replace("auth.html?role=seller");
 S.u=u;
 try{
  const a=await getDoc(doc(db,"sellerApplications",u.uid));
  if(!a.exists()){$("load").hidden=true;$("v").hidden=false;$("v").innerHTML='<div class="card"><h2>You haven’t applied yet</h2><p class="mu">Tell us about your shop to start selling.</p><a class="btn g w" href="apply.html">Apply to sell</a></div>';return}
  S.app=a.data();
  try{const p=await getDoc(doc(db,"users",u.uid));S.prof=p.exists()?p.data():{}}catch(e){}
  if(S.app.status!=="approved"){$("load").hidden=true;$("v").hidden=false;$("v").innerHTML=statusPage(S.app);return}
  try{await loadProducts()}catch(e){$("v").hidden=false;$("load").hidden=true;$("v").innerHTML='<div class="card empty"><h3>Couldn’t load your products</h3><p>Check your connection, or the latest Firestore rules may not be published yet.</p></div>';return}
  try{const f=await getDocs(query(collection(db,"follows"),where("sellerId","==",u.uid)));S.fol=f.size;S.fl=f.docs.map(d=>d.data())}catch(e){}
  try{const c=await getDocs(query(collection(db,"chats"),where("sellerId","==",u.uid)));S.ch=c.docs.map(d=>d.data())}catch(e){}
  $("load").hidden=true;$("v").hidden=false;$("bn").hidden=false;route();
 }catch(e){$("load").textContent="Couldn’t load your dashboard. Check your connection and reload."}
});
</script>
