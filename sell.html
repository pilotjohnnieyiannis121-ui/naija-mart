<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add a product – Naija Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#0F3D2E;--gold:#C7A64A;--bg:#FBFAF6;--sf:#fff;--tx:#1D2822;--mu:#68756E;--ln:#E5E9E2;--ti:#F1F4EE;--gr:#185541;--rd:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0C1210;--sf:#141E19;--tx:#EEF2EE;--mu:#A3B0A9;--ln:#24312A;--ti:#16231C;--gr:#8FD0B3;--rd:#F2928B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 17px/1.55 Manrope,Inter,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:600px;margin:0 auto;padding:18px 18px 60px}
.top{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.3rem "Playfair Display",Georgia,serif;color:inherit;text-decoration:none;flex:1}
.logo i{width:38px;height:38px;border-radius:11px;background:var(--g1);color:#fff;display:grid;place-items:center;font:800 1.15rem "Playfair Display",serif;font-style:normal;box-shadow:inset 0 0 0 1px rgba(199,166,74,.7)}
.logo b{color:var(--gold)}
h1,h2{font-family:"Playfair Display",Georgia,serif;margin:0}
h1{font-size:1.9rem;margin:22px 0 4px}h2{font-size:1.25rem;margin-bottom:6px}
.mu{color:var(--mu);font-size:.95rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:18px;margin:14px 0}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:6px}
input,select,textarea{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);padding:0 14px;margin-bottom:14px;font:inherit}
textarea{padding:12px 14px;min-height:100px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:50px;padding:0 20px;border-radius:99px;border:1.5px solid var(--g1);background:none;color:var(--g1);font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.p{background:var(--g1);color:#fff}.btn.w{width:100%}.btn.s{min-height:40px;padding:0 14px;font-size:.9rem}.btn.r{border-color:var(--rd);color:var(--rd)}.btn:disabled{opacity:.6}
@media (prefers-color-scheme:dark){.btn:not(.p){color:var(--tx);border-color:var(--ln)}}
.msg{border-radius:14px;padding:12px 14px;margin:12px 0;display:none}
.msg.ok{display:block;background:#CDEBD9;color:#0F3D2E}.msg.err{display:block;background:#F7D3D0;color:#7A1912}
.pv{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.th{position:relative;width:92px;height:92px}.th img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:1px solid var(--ln)}
.th button{position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--rd);color:#fff;font-weight:800;cursor:pointer}
.up{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border:1.5px dashed var(--g1);border-radius:16px;color:var(--gr);font-weight:700;cursor:pointer}
.up input{display:none}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln);flex-wrap:wrap}
.it:first-child{border-top:0}.it .sp{flex:1;min-width:140px}
.pill{display:inline-block;border-radius:8px;padding:1px 10px;font-size:.78rem;font-weight:800}
.pill.active{background:#D8EFE2;color:#145C38}.pill.hidden{background:#EDF0EE;color:#5E6962}.pill.removed{background:#F8D9D6;color:#8A1C14}
.note{border-left:4px solid var(--gold);background:var(--ti);padding:10px 12px;border-radius:0 12px 12px 0;font-size:.9rem;color:var(--mu)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
 <div class="top"><a class="logo" href="index.html"><i>N</i><span>Naija<b>Mart</b></span></a><a class="btn s" href="seller.html">Seller home</a></div>
 <div id="load" class="mu" style="margin-top:30px">Loading…</div>

 <div id="blocked" hidden class="card"><h2>Your shop must be approved first</h2><p class="mu" id="bs"></p><a class="btn p" href="account.html">Go to my account</a></div>

 <div id="form" hidden>
  <h1>Add a product</h1>
  <p class="mu">Selling as <b id="sn"></b>. It appears in the marketplace right away.</p>
  <div class="msg" id="msg" role="alert"></div>
  <form class="card" id="f" novalidate>
   <label>Photos <span class="mu">(up to 3, shrunk on your phone to save data)</span></label>
   <div class="pv" id="pv"></div>
   <label class="up" for="pf">＋ Add photos<input id="pf" type="file" accept="image/*" multiple></label>
   <div style="height:14px"></div>
   <label for="pn">Product name</label><input id="pn" maxlength="100" placeholder="e.g. Ankara dress">
   <div class="two"><div><label for="pp">Price (₦)</label><input id="pp" type="number" min="0" inputmode="numeric" placeholder="18000"></div>
   <div><label for="pd">Condition</label><select id="pd"><option>New</option><option>Used</option></select></div></div>
   <label for="pc">Category</label><select id="pc"></select>
   <div class="two"><div><label for="ps">State</label><select id="ps"></select></div><div><label for="pi">City or town</label><input id="pi" maxlength="60"></div></div>
   <label for="pa">Market or area</label><input id="pa" maxlength="80">
   <label for="pk">Stock</label><select id="pk"><option value="in">In stock</option><option value="low">Low stock</option><option value="out">Out of stock</option></select>
   <label for="po">Sizes, colors or models <span class="mu">(optional)</span></label><input id="po" maxlength="120" placeholder="Sizes S–XL, Blue, Red">
   <label for="pl">Pickup and delivery</label><select id="pl"><option>Pickup and delivery</option><option>Pickup only</option><option>Delivery only</option></select>
   <label for="pt">Description</label><textarea id="pt" maxlength="1000" placeholder="Tell buyers what makes this product good."></textarea>
   <button class="btn p w" id="go">Publish product</button>
   <p class="note" style="margin-top:14px">Be honest about price and stock. Buyers can report misleading listings, and our team can hide or remove them.</p>
  </form>

  <h2 id="mine" style="margin-top:26px">Your products</h2>
  <div class="card" id="ml"></div>
 </div>
</div>

<script type="module">
const firebaseConfig={apiKey:"AIzaSyCRQapXUQ32P4tpKaMiS11uccUc-z5k9yg",authDomain:"naija-mart-35ba6.firebaseapp.com",projectId:"naija-mart-35ba6",appId:"1:761759831734:web:2780ba182d5947d0cff817"};
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,query,where,getDocs,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATES=["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT (Abuja)","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
const CATS=["Fashion and clothing","Shoes and bags","Phones and electronics","Home and furniture","Beauty and personal care","Food and groceries","Health and wellness","Building materials","Automotive and spare parts","Sports and fitness","Books and education","Other products"];
const N=n=>"₦"+Number(n).toLocaleString("en-NG");
let user,shop,imgs=[];
const say=(t,k)=>{const m=$("msg");m.textContent=t;m.className="msg "+k;m.scrollIntoView({block:"nearest",behavior:"smooth"})};
$("pc").innerHTML=CATS.map((c,i)=>'<option value="'+i+'">'+c+'</option>').join("");
$("ps").innerHTML=STATES.map(s=>"<option>"+s+"</option>").join("");

function shrink(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q))};
 im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};im.src=url})}
function prev(){$("pv").innerHTML=imgs.map((m,i)=>'<div class="th"><img src="'+m.thumb+'" alt="Photo '+(i+1)+'"><button type="button" data-rm="'+i+'" aria-label="Remove photo '+(i+1)+'">✕</button></div>').join("")}
$("pf").onchange=async e=>{
 const fl=[...e.target.files];e.target.value="";
 for(const f of fl){
  if(imgs.length>=3){say("You can add up to 3 photos.","err");break}
  if(!f.type.startsWith("image/")||f.size>15e6){say("Choose a photo under 15 MB.","err");continue}
  try{let full=await shrink(f,800,.72);if(full.length>200000)full=await shrink(f,640,.55);imgs.push({full,thumb:await shrink(f,320,.6)})}
  catch(x){say("Couldn’t read that photo. Try another.","err")}
 }
 prev();
};

async function mine(){
 const s=await getDocs(query(collection(db,"products"),where("sellerId","==",user.uid)));
 const L=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 $("ml").innerHTML=L.length?L.map(p=>'<div class="it"><div class="sp"><b>'+esc(p.name)+'</b><div class="mu">'+N(p.price)+' · '+({in:"In stock",low:"Low stock",out:"Out of stock"}[p.stock]||"")+'</div><span class="pill '+esc(p.status)+'">'+(p.status==="removed"?"Removed by admin":p.status==="hidden"?"Hidden":"Live")+'</span></div>'+
  (p.status==="removed"?'':'<button class="btn s" data-t="'+p.id+'" data-v="'+(p.status==="active"?"hidden":"active")+'">'+(p.status==="active"?"Hide":"Show")+'</button><button class="btn s" data-s="'+p.id+'" data-v="'+(p.stock==="out"?"in":"out")+'">'+(p.stock==="out"?"Back in stock":"Mark out of stock")+'</button>')+
  '<button class="btn s r" data-d="'+p.id+'">Delete</button></div>').join(""):'<p class="mu" style="margin:0">No products yet. Add your first one above.</p>';
}
$("f").onsubmit=async e=>{
 e.preventDefault();
 const name=$("pn").value.trim(),price=Math.round(Number($("pp").value)),cat=+$("pc").value,state=$("ps").value,city=$("pi").value.trim(),area=$("pa").value.trim(),desc=$("pt").value.trim();
 if(name.length<2)return say("Enter the product name.","err");
 if(!(price>=0)||$("pp").value==="")return say("Enter the price in naira.","err");
 if(!city||!area)return say("Enter the city and market or area.","err");
 if(!desc)return say("Add a short description.","err");
 if(!navigator.onLine)return say("No connection. Check your internet and try again.","err");
 $("go").disabled=true;
 try{
  const ref=doc(collection(db,"products"));
  await setDoc(ref,{sellerId:user.uid,shopName:shop.shopName,name,price,cat,state,city,area,cond:$("pd").value,stock:$("pk").value,desc,options:$("po").value.trim(),delivery:$("pl").value,thumb:imgs[0]?imgs[0].thumb:"",photoCount:imgs.length,status:"active",createdAt:serverTimestamp()});
  let ok=true;
  for(let i=0;i<imgs.length;i++){try{await setDoc(doc(db,"products",ref.id,"photos",String(i)),{data:imgs[i].full,idx:i})}catch(x){ok=false}}
  say(ok?"Published! Your product is live in the marketplace.":"Published, but some photos didn’t upload. Delete it below and try again.",ok?"ok":"err");
  $("f").reset();imgs=[];prev();fill();await mine();
 }catch(x){say(x.code==="permission-denied"?"Not allowed. Your shop must be approved, and the latest Firestore rules must be published.":"Couldn’t publish. Check your connection and try again.","err")}
 $("go").disabled=false;
};
function fill(){$("ps").value=shop.state;$("pi").value=shop.city;$("pa").value=shop.area}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-rm],[data-t],[data-s],[data-d]");if(!t)return;const d=t.dataset;
 if(d.rm!==undefined){imgs.splice(+d.rm,1);return prev()}
 t.disabled=true;
 try{
  if(d.t)await updateDoc(doc(db,"products",d.t),{status:d.v,updatedAt:serverTimestamp()});
  else if(d.s)await updateDoc(doc(db,"products",d.s),{stock:d.v,updatedAt:serverTimestamp()});
  else if(d.d){if(!confirm("Delete this product for good?")){t.disabled=false;return}
   const b=writeBatch(db);for(let i=0;i<3;i++)b.delete(doc(db,"products",d.d,"photos",String(i)));b.delete(doc(db,"products",d.d));await b.commit()}
  await mine();
 }catch(x){say("That didn’t work. Please try again.","err");t.disabled=false}
});
onAuthStateChanged(auth,async u=>{
 if(!u)return location.replace("auth.html?role=seller");
 user=u;
 try{
  const a=await getDoc(doc(db,"sellerApplications",u.uid));$("load").hidden=true;
  if(!a.exists()||a.data().status!=="approved"){$("blocked").hidden=false;$("bs").textContent=a.exists()?"Your application is "+a.data().status+". You can add products once it’s approved.":"You haven’t applied to sell yet. Apply from your account page.";return}
  shop=a.data();$("sn").textContent=shop.shopName;$("form").hidden=false;fill();await mine();
 }catch(e){$("load").hidden=false;$("load").textContent="Couldn’t load. Check your connection and reload."}
});
</script>
</body>
</html>
